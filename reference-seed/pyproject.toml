[project]
name = "livingruntime-reference-seed"
version = "0.1.0"
description = "Minimal interoperability Seed for LivingRuntime Agent Network"
requires-python = ">=3.11"
dependencies = ["agent-network-sdk", "uvicorn>=0.27", "starlette>=0.37"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
reference-seed = "reference_seed.app:run"

[tool.pytest.ini_options]
pythonpath = ["src", "../agent-network-sdk-python/src"]
testpaths = ["tests"]
asyncio_mode = "auto"
